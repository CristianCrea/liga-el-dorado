<title>Liga El Dorado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  /* Tokens tomados del sistema de variables de Figma (colección Tokens · modo Light) */
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --bg-2: #FAFAF9;
    --bg-3: #F5F5F4;
    --inverse: #0C0A09;
    --brand: #EDD478;
    --brand-hover: #E6C14A;
    --brand-pressed: #DCA82A;
    --brand-subtle: #FCF9EA;
    --brand-text: #9B611C;
    --focus: #DCA82A;
    --text: #0C0A09;
    --text-2: #57534E;
    --text-3: #A8A29E;
    --text-disabled: #D6D3D1;
    --line: #E7E5E4;
    --line-strong: #D6D3D1;
    --ok-bg: #F0FDF4; --ok: #16A34A; --ok-text: #15803D;
    --err-bg: #FEF2F2; --err: #DC2626; --err-text: #B91C1C;
    --warn-bg: #FFF7ED; --warn: #EA580C; --warn-text: #C2410C;
    --info-bg: #EFF6FF; --info: #2563EB; --info-text: #1D4ED8;
    --page: #ECEAE5;
    --spotlight: #0C0A09;
    --on-inverse: #FFFFFF;
    --on-brand: #0C0A09;
    --secondary-hover: #292524;
    --icon-brand: #DCA82A;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 28px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Modo oscuro: mismos valores que el modo Dark de la colección Tokens en Figma */
  :root[data-mode="dark"] {
    color-scheme: dark;
    --bg: #0C0A09; --bg-2: #1C1917; --bg-3: #292524; --inverse: #FFFFFF;
    --brand: #EDD478; --brand-hover: #F4E398; --brand-pressed: #E6C14A; --brand-subtle: #3F210D; --brand-text: #EDD478; --focus: #EDD478;
    --text: #FAFAF9; --text-2: #A8A29E; --text-3: #78716C; --text-disabled: #44403C;
    --line: #292524; --line-strong: #44403C;
    --ok-bg: #14532D; --ok: #22C55E; --ok-text: #86EFAC;
    --err-bg: #7F1D1D; --err: #EF4444; --err-text: #FCA5A5;
    --warn-bg: #7C2D12; --warn: #F97316; --warn-text: #FDBA74;
    --info-bg: #1E3A8A; --info: #3B82F6; --info-text: #93C5FD;
    --page: #151311; --spotlight: #1C1917; --on-inverse: #0C0A09; --secondary-hover: #F5F5F4; --icon-brand: #EDD478;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font-family: var(--font); font-size: 13px; -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Marco de presentación ---------- */
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding-block: 24px; }
  .side { width: 260px; display: flex; flex-direction: column; gap: 20px; }
  .side h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.05; text-wrap: balance; }
  .side h1 span { display: block; color: var(--brand-text); }
  .side p { margin: 0; color: var(--text-2); line-height: 1.5; }
  .side .label { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: var(--text-3); text-transform: uppercase; }
  .jump { display: flex; flex-direction: column; gap: 6px; }
  .jump button { text-align: left; padding: 10px 12px; border-radius: var(--r-md); background: var(--bg); border: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .jump button small { color: var(--text-3); font-weight: 500; }
  .jump button:hover { border-color: var(--line-strong); }

  .device {
    position: relative; width: 390px; height: min(844px, calc(100vh - 48px)); min-height: 640px;
    background: var(--bg); border-radius: 46px; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 0 0 10px #1C1917, 0 0 0 11px #44403C, 0 30px 60px rgba(12,10,9,.25);
  }
  @media (max-width: 900px) { .side { display: none; } }
  @media (max-width: 500px) {
    body { padding-inline: 0; }
    .stage { padding-block: 0; }
    .device { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; }
    .statusbar { display: none !important; }
  }

  /* ---------- Pantallas ---------- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .screen.push { animation: push .28s ease-out; }
  .screen.pop { animation: pop .28s ease-out; }
  .screen.fade { animation: fade .18s ease-out; }
  @keyframes push { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none !important; } }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 6px; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .statusbar .ind { display: flex; gap: 6px; align-items: center; }
  .statusbar .bars { display: flex; gap: 2px; align-items: flex-end; }
  .statusbar .bars i { width: 3px; background: currentColor; border-radius: 1px; }
  .statusbar .bat { width: 22px; height: 11px; border: 1.2px solid currentColor; border-radius: 3px; padding: 1.5px; }
  .statusbar .bat i { display: block; height: 100%; width: 85%; background: currentColor; border-radius: 1.5px; }
  .on-color { color: #fff; }

  /* ---------- Componentes ---------- */
  .ic { display: inline-block; flex-shrink: 0; }
  .badge { --tc: var(--inverse); display: inline-grid; place-items: center; border-radius: 50%; background: var(--tc); color: #fff; font-weight: 700; flex-shrink: 0; }
  .badge.s { width: 28px; height: 28px; font-size: 10px; }
  .badge.m { width: 40px; height: 40px; font-size: 14px; font-weight: 900; }
  .badge.l { width: 64px; height: 64px; font-size: 22px; font-weight: 900; border: 2px solid #fff; }
  .badge.xl { width: 80px; height: 80px; font-size: 28px; font-weight: 900; border: 3px solid var(--brand); }

  .appheader { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 16px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: .2px; }
  .logo .mark { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 900; font-size: 14px; }
  .iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-3); position: relative; flex-shrink: 0; }
  .iconbtn.oncolor { background: rgba(255,255,255,.18); color: #fff; }
  .iconbtn .dot { position: absolute; top: 5px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--err); border: 2px solid var(--bg); }

  .days { display: flex; gap: 8px; padding: 0 20px 20px; }
  .day { width: 46px; padding: 8px 0; border-radius: var(--r-md); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--bg); }
  .day small { font-size: 10px; font-weight: 600; letter-spacing: .3px; color: var(--text-2); }
  .day b { font-size: 15px; font-weight: 800; }
  .day[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
  .day[aria-pressed="true"], .day[aria-pressed="true"] small { color: var(--on-brand); }
  .day.cal { background: var(--bg-3); border-color: var(--bg-3); justify-content: center; }

  .section { display: flex; flex-direction: column; gap: 12px; }
  .sechead { display: flex; justify-content: space-between; align-items: center; }
  .sechead h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .4px; }
  .sechead .link { color: var(--text-2); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
  .content { padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 24px; }
  .list { display: flex; flex-direction: column; gap: 12px; }

  .fixture { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
  .fixture:hover { border-color: var(--line-strong); box-shadow: 0 4px 14px rgba(12,10,9,.05); }
  .fixture .meta { display: flex; justify-content: space-between; align-items: center; }
  .fixture .meta b { font-size: 12px; font-weight: 600; display: block; }
  .fixture .meta span { font-size: 11px; color: var(--text-3); }
  .fixture hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .matchup { display: flex; align-items: center; gap: 8px; }
  .matchup .team { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .matchup .team.right { justify-content: flex-end; text-align: right; }
  .teamname { font-size: 11px; font-weight: 600; letter-spacing: .1px; text-transform: uppercase; line-height: 1.25; }
  .teamlink { border-radius: 4px; text-align: left; }
  .matchup .team.right .teamlink { text-align: right; }
  .teamlink:hover { text-decoration: underline; text-underline-offset: 2px; }
  .vs { font-size: 12px; font-weight: 800; color: var(--text-3); }

  .bottomnav { display: flex; justify-content: space-between; padding: 12px 32px 22px; border-top: 1px solid var(--line); background: var(--bg); flex-shrink: 0; }
  .navitem { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }
  .navitem[aria-current="page"] { color: var(--text); font-weight: 600; }

  /* Cabeceras con color */
  .hero { padding: 0 20px 24px; border-radius: 0 0 var(--r-xl) var(--r-xl); display: flex; flex-direction: column; gap: 16px; color: #fff; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .topbar b { font-size: 14px; font-weight: 600; }
  .identity { display: flex; align-items: center; gap: 16px; }
  .teamtitle { margin: 0; font-size: 30px; font-weight: 900; line-height: .92; letter-spacing: -.5px; text-transform: uppercase; }
  .teamtitle span { display: block; color: var(--brand); }
  .muted75 { opacity: .75; font-size: 12px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 999px; font-weight: 800; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; transition: background .15s; }
  .btn.primary { background: var(--brand); color: var(--on-brand); }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-pressed); }
  .btn.secondary { background: var(--inverse); color: var(--on-inverse); }
  .btn.secondary:hover { background: var(--secondary-hover); }
  .btn.block { width: 100%; }
  .btn[disabled] { background: var(--bg-3); color: var(--text-3); cursor: not-allowed; }

  .tabs { margin: 20px 20px 8px; padding: 4px; border-radius: var(--r-lg); background: var(--bg-3); display: flex; gap: 4px; }
  .tab { flex: 1; padding: 10px 12px; border-radius: var(--r-md); color: var(--text-2); font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--inverse); color: var(--on-inverse); font-weight: 700; }

  .card { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); }
  .inforow { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .inforow:last-child { border-bottom: 0; }
  .inforow span { color: var(--text-2); font-weight: 500; }
  .inforow b { font-weight: 600; text-align: right; }
  .inforow.total { background: var(--bg-2); }
  .inforow.total span { color: var(--text); font-weight: 700; }
  .inforow.total b { font-size: 15px; font-weight: 800; }

  .stats { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .statrow { display: flex; align-items: center; }
  .stat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stat small { font-size: 9px; font-weight: 600; letter-spacing: .4px; color: var(--text-3); text-transform: uppercase; }
  .stat b { font-size: 24px; font-weight: 900; }
  .stat.hl b { color: var(--brand-text); }
  .vdiv { width: 1px; height: 34px; background: var(--line); }
  .hdiv { height: 1px; background: var(--line); }
  .chips { display: flex; gap: 6px; }
  .res { width: 24px; height: 24px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .res.G { background: var(--brand); color: var(--on-brand); } .res.E { background: var(--bg-3); } .res.P { background: var(--err-bg); color: var(--err-text); }
  .meter { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meter .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); font-weight: 500; }
  .meter .top b { color: var(--text); }
  .track { height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
  .para { margin: 0; color: var(--text-2); line-height: 1.5; font-size: 13px; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; background: var(--bg-3); color: var(--text-2); font-size: 11px; font-weight: 600; }
  .pill[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .player { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .player:last-child { border-bottom: 0; }
  .player .n { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; font-weight: 800; }
  .player .who { flex: 1; min-width: 0; }
  .player .who b { display: block; font-weight: 600; font-size: 13px; }
  .player .who span { font-size: 11px; color: var(--text-3); }
  .tag { padding: 4px 8px; border-radius: var(--r-sm); background: var(--brand-subtle); color: var(--brand-text); font-size: 10px; font-weight: 700; letter-spacing: .3px; }
  .empty-note { padding: 18px; text-align: center; color: var(--text-3); font-size: 12px; }

  /* Próximo partido */
  .nextcard { background: var(--spotlight); color: #fff; border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .nextcard .kicker { font-size: 10px; font-weight: 600; letter-spacing: .3px; color: var(--brand); }
  .countdown { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 10px; font-weight: 600; letter-spacing: .3px; }
  .nextcard .mu { display: flex; align-items: center; justify-content: space-between; }
  .nextcard .col { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .nextcard .when { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nextcard .when b { font-size: 15px; font-weight: 800; }
  .nextcard .when span, .nextcard .venue { font-size: 11px; color: var(--text-3); }
  .nextcard .venue { display: flex; align-items: center; justify-content: center; gap: 4px; }

  /* Detalle de partido */
  .matchhero { background: var(--spotlight); }
  .mhmu { display: flex; align-items: center; justify-content: space-between; }
  .mhcol { width: 100px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .mhcol .teamname { font-weight: 800; color: #fff; }
  .mhtime { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mhtime small { font-size: 10px; font-weight: 600; letter-spacing: .3px; color: var(--text-3); }
  .mhtime b { font-size: 24px; font-weight: 900; }
  .status-pill { padding: 4px 8px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 10px; font-weight: 600; letter-spacing: .3px; }
  .ctacard { background: var(--brand-subtle); border: 1px solid var(--brand); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .icontile { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex-shrink: 0; }
  .balance { background: var(--bg-2); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .splitbar { display: flex; gap: 3px; }
  .splitbar i { height: 6px; border-radius: 3px; display: block; }
  .h2h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .h2h:last-child { border-bottom: 0; }
  .h2h .d { width: 88px; flex-shrink: 0; }
  .h2h .d b { display: block; font-size: 12px; font-weight: 600; }
  .h2h .d span { font-size: 11px; color: var(--text-3); }
  .h2h .score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-2); }
  .h2h .score b { padding: 4px 8px; border-radius: var(--r-sm); background: var(--bg-3); color: var(--text); font-size: 13px; font-weight: 800; }
  .caption { font-size: 11px; color: var(--text-3); margin: 0; }

  .formations { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .formation { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--bg-3); font-size: 11px; font-weight: 600; }
  .formation i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .formation em { font-style: normal; font-weight: 800; color: var(--text-2); }
  .pitch { position: relative; width: 100%; aspect-ratio: 335 / 540; max-width: 100%; border-radius: var(--r-lg); overflow: hidden;
    background: repeating-linear-gradient(to bottom, #2E7D4F 0 12.5%, #338A58 12.5% 25%); }
  .pitch .ln { position: absolute; border: 1.5px solid rgba(255,255,255,.55); }
  .pitch .pl { position: absolute; width: 64px; margin-left: -32px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pitch .pl .badge { border: 1.5px solid #fff; }
  .pitch .pl span { color: #fff; font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .absence { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .absence:last-child { border-bottom: 0; }
  .absence .ind { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center; flex-shrink: 0; font-weight: 900; font-size: 18px; }
  .absence .who { flex: 1; min-width: 0; }
  .absence .who b { display: block; font-size: 13px; font-weight: 600; }
  .absence .who span { font-size: 11px; color: var(--text-3); line-height: 1.35; }
  .state { padding: 4px 8px; border-radius: var(--r-sm); font-size: 10px; font-weight: 700; letter-spacing: .3px; }
  .t-exp { background: var(--err-bg); color: var(--err-text); }
  .t-les { background: var(--warn-bg); color: var(--warn-text); }
  .t-dud { background: var(--info-bg); color: var(--info-text); }
  .redcard { width: 11px; height: 15px; border-radius: 2px; background: var(--err); transform: rotate(-12deg); }

  /* Compra */
  .innerbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
  .innerbar b { font-size: 15px; font-weight: 700; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .steps .lbl { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .3px; color: var(--text-3); }
  .steps .lbl b { color: var(--text); font-size: 12px; letter-spacing: 0; }
  .steps .seg { display: flex; gap: 6px; }
  .steps .seg i { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-3); }
  .steps .seg i.on { background: var(--brand); }
  .zone { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); }
  .zone .sw { width: 6px; height: 36px; border-radius: 3px; flex-shrink: 0; }
  .zone .z { flex: 1; min-width: 0; }
  .zone .z b { display: block; font-size: 13px; font-weight: 600; }
  .zone .z span { font-size: 11px; color: var(--text-3); }
  .zone .p { text-align: right; }
  .zone .p b { display: block; font-size: 13px; font-weight: 600; }
  .zone .p span { font-size: 11px; color: var(--text-3); }
  .zone[aria-checked="true"] { background: var(--brand-subtle); border: 1.5px solid var(--focus); }
  .zone[aria-disabled="true"] { background: var(--bg-2); cursor: not-allowed; }
  .zone[aria-disabled="true"] .z b, .zone[aria-disabled="true"] .z span { color: var(--text-disabled); }

        <div class="success">${ic('check', 36)}</div>
        <div style="text-align:center;display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:24px;font-weight:900">¡Compra exitosa!</h1>
          <p class="para">Enviamos ${b.qty > 1 ? `tus ${b.qty} boletas` : 'tu boleta'} a ${b.form.email}. También las encuentras en "Mis boletas".</p></div>
        <div class="ticket"><div class="head"><div class="k"><span>LIGA EL DORADO · FECHA 9</span><span>${b.qty} ${b.qty > 1 ? 'BOLETAS' : 'BOLETA'}</span></div>
            <div class="mu"><span class="t">${badge(m.home)}${TEAMS[m.home].name}</span><span style="font-weight:600">VS</span><span class="t">${TEAMS[m.away].name}${badge(m.away)}</span></div>
            <span style="font-size:11px">${fmtLong(m)} · ${m.time} · ${m.venue.split(' ·')[0]}</span></div>
          <div class="perf"><i></i><i></i></div>
          <div class="body"><canvas id="qr" width="21" height="21" aria-label="Código QR de ingreso"></canvas>
            <dl><div><dt>Zona</dt><dd>${z.name}</dd></div><div><dt>Puerta</dt><dd class="num">${z.gate}</dd></div><div><dt>Titular</dt><dd>${b.form.name}</dd></div><div><dt>Orden</dt><dd class="num">${b.order}</dd></div></dl></div></div>
        <p class="caption" style="text-align:center">Presenta el código QR en la puerta de ingreso. Llega 1 hora antes.</p>
        <div style="display:flex;flex-direction:column;gap:10px"><button type="button" class="btn primary block" data-act="toast" data-msg="Mis boletas llega pronto">${ic('ticket', 16)}Ver mis boletas</button>
          <button type="button" class="btn secondary block" data-act="nav" data-to="home">${ic('home', 16)}Volver al inicio</button></div>
      </div></div>`;
  }
  function scrEmpty(kind) {
    const c = kind === 'following'
      ? { title: 'Siguiendo', icon: 'star', h: 'Aún no sigues equipos', p: 'Sigue a tus equipos favoritos para ver aquí sus partidos, resultados y noticias.', cta: '<button type="button" class="btn secondary" data-act="nav" data-to="home">Explorar equipos</button>' }
      : { title: 'Perfil', icon: 'user', h: 'Tu perfil está en construcción', p: 'Muy pronto podrás ver tus boletas, tus datos y tus preferencias desde aquí.', cta: '' };
    const settings = kind === 'profile' ? `<div class="card settings"><b>Apariencia</b>${modeSwitch('mode')}</div>` : '';
    return `${statusBar()}<h1 class="pagetitle">${c.title}</h1>${settings}<div class="emptystate"><span class="ill">${ic(c.icon, 36)}</span><h2>${c.h}</h2><p class="para" style="max-width:300px">${c.p}</p>${c.cta}</div>${bottomNav(kind)}`;
  }

  /* ---------------- Modo claro / oscuro ---------------- */
  const modeSwitch = act => `<div class="modeswitch" role="radiogroup" aria-label="Apariencia">${[['light', 'sun', 'Claro'], ['dark', 'moon', 'Oscuro']].map(([m, i, l]) => `<button type="button" role="radio" aria-checked="${state.mode === m}" data-act="${act}" data-mode="${m}">${ic(i, 16)}${l}</button>`).join('')}</div>`;
  function setMode(m, save = true) {
    state.mode = m === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.mode = state.mode;
    const side = document.getElementById('side-mode'); if (side) side.outerHTML = modeSwitch('mode').replace('class="modeswitch"', 'class="modeswitch" id="side-mode"');
    if (save) { try { localStorage.setItem('ld-mode', state.mode); } catch (e) {} }
  }
  {
    let initial = 'light';
    try { initial = localStorage.getItem('ld-mode') || 'light'; } catch (e) {}
    if (/^#(oscuro|dark)$/.test(location.hash)) initial = 'dark';
    if (/^#(claro|light)$/.test(location.hash)) initial = 'light';
    setMode(initial, false);
  }
  document.querySelector('.side').addEventListener('click', ev => { const b = ev.target.closest('[data-act="mode"]'); if (b) { setMode(b.dataset.mode); render('none'); } });

  /* ---------------- Render ---------------- */
  function drawQR(seed) {
    const cv = document.getElementById('qr'); if (!cv) return; const x = cv.getContext('2d'); const N = 21; const r = rng(seed);
    x.fillStyle = '#fff'; x.fillRect(0, 0, N, N); x.fillStyle = '#0C0A09';
    const finders = [[0, 0], [N - 7, 0], [0, N - 7]];
    for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) {
      const f = finders.find(([fx, fy]) => xx >= fx && xx < fx + 7 && yy >= fy && yy < fy + 7); let on;
      if (f) { const dx = xx - f[0], dy = yy - f[1]; on = dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); }
      else if (finders.some(([fx, fy]) => xx >= fx - 1 && xx <= fx + 7 && yy >= fy - 1 && yy <= fy + 7)) on = false;
      else on = r() > .52;
      if (on) x.fillRect(xx, yy, 1, 1);
    }
  }
  function render(anim) {
    const r = cur(); let html = '';
    if (r.screen === 'home') html = scrHome();
    else if (r.screen === 'team') html = scrTeam(r);
    else if (r.screen === 'match') html = scrMatch(r);
    else if (r.screen === 'select') html = scrSelect();
    else if (r.screen === 'pay') html = scrPay();
    else if (r.screen === 'confirm') html = scrConfirm();
    else html = scrEmpty(r.screen);
    const keepScroll = anim === 'none' ? device.querySelector('.scroll')?.scrollTop : 0;
    device.innerHTML = `<section class="screen ${anim && anim !== 'none' ? anim : ''}">${html}${state.toast ? `<div class="toast" role="status">${state.toast}</div>` : ''}</section>`;
    const sc = device.querySelector('.scroll'); if (sc && keepScroll) sc.scrollTop = keepScroll;
    if (r.screen === 'confirm') drawQR(state.buy.order);
  }
  let toastTimer;
  function toast(msg) { state.toast = msg; render('none'); clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = null; render('none'); }, 1800); }

  function validate() {
    const b = state.buy, f = b.form, e = {};
    if (!f.name.trim()) e.name = 'Escribe tu nombre completo.';
    if (f.doc.replace(/\D/g, '').length < 6) e.doc = 'Escribe un número de cédula válido.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = 'Escribe un correo con el formato nombre@dominio.com.';
    if (b.method === 'card') {
      if (f.cardNum.replace(/\D/g, '').length < 15) e.cardNum = 'El número de tarjeta debe tener 15 o 16 dígitos.';
      if (!/^\s*\d{2}\s*\/\s*\d{2}\s*$/.test(f.exp)) e.exp = 'Usa el formato MM / AA.';
      if (!/^\d{3,4}$/.test(f.cvv.trim())) e.cvv = 'Escribe los 3 dígitos del reverso.';
      if (!f.holder.trim()) e.holder = 'Escribe el nombre como aparece en la tarjeta.';
    }
    if (b.method === 'nequi' && f.phone.replace(/\D/g, '').length !== 10) e.phone = 'El celular debe tener 10 dígitos.';
    b.errors = e; return !Object.keys(e).length;
  }

  device.addEventListener('input', ev => { const k = ev.target.dataset.field; if (k && state.buy) { state.buy.form[k] = ev.target.value; if (state.buy.errors[k]) { delete state.buy.errors[k]; ev.target.closest('.field')?.classList.remove('error'); ev.target.parentElement.querySelector('.err')?.remove(); } } });
  device.addEventListener('change', ev => { const k = ev.target.dataset.field; if (k && state.buy) state.buy.form[k] = ev.target.value; });
  device.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); } });
  device.addEventListener('submit', ev => ev.preventDefault());
  device.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || !device.contains(el)) return;
    const a = el.dataset.act, r = cur();
    switch (a) {
      case 'back': back(); break;
      case 'nav': { const to = el.dataset.to; if (to !== r.screen || state.stack.length > 1) root({ screen: to }); break; }
      case 'match': go({ screen: 'match', id: el.dataset.id, tab: 0 }); break;
      case 'team': go({ screen: 'team', team: el.dataset.team, tab: 0 }); break;
      case 'teamtab': r.tab = +el.dataset.i; r.filter = 'Todos'; render('none'); device.querySelector('.scroll').scrollTop = device.querySelector('.tabs').offsetTop - 60; break;
      case 'matchtab': r.tab = +el.dataset.i; render('none'); device.querySelector('.scroll').scrollTop = device.querySelector('.tabs').offsetTop - 60; break;
      case 'filter': r.filter = el.dataset.f; render('none'); break;
      case 'follow': { const k = el.dataset.team; state.following[k] = !state.following[k]; render('none'); break; }
      case 'day': state.tabHome = +el.dataset.i; render('none'); break;
      case 'buy': startBuy(el.dataset.id); break;
      case 'zone': state.buy.zone = el.dataset.z; render('none'); break;
      case 'qty': state.buy.qty = Math.min(6, Math.max(1, state.buy.qty + +el.dataset.d)); render('none'); break;
      case 'toPay': go({ screen: 'pay' }); break;
      case 'method': state.buy.method = el.dataset.m; state.buy.errors = {}; render('none'); break;
      case 'pay':
        if (validate()) { state.buy.order = '#LD-' + (40000 + Math.floor(Math.random() * 9999)); go({ screen: 'confirm' }); }
        else { render('none'); const first = device.querySelector('.field.error input'); if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
        break;
      case 'toast': toast(el.dataset.msg); break;
      case 'mode': setMode(el.dataset.mode); render('none'); break;
    }
  });
  document.querySelector('.jump').addEventListener('click', ev => {
    const b = ev.target.closest('[data-jump]'); if (!b) return; const j = b.dataset.jump;
    if (j === 'home' || j === 'following' || j === 'profile') root({ screen: j });
    else if (j === 'match') { state.stack = [{ screen: 'home' }]; go({ screen: 'match', id: 'm1', tab: 0 }); }
    else if (j === 'team') { state.stack = [{ screen: 'home' }]; go({ screen: 'team', team: 'SU', tab: 0 }); }
    else if (j === 'buy') { const m = upcomingFor('SU')[0]; state.stack = [{ screen: 'home' }, { screen: 'team', team: 'SU', tab: 1 }]; startBuy(m.id); }
  });
  render('fade');
})();
</script>
